name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            outputs: |
            "dist/github-snake.svg?palette=github-light&color_snake=7C3AED&color_dots=#e2e8f0,#bae6fd,#7dd3fc,#38bdf8,#0284c7"
            "dist/github-snake-dark.svg?palette=github-dark&color_snake=22D3EE&color_dots=#334155,#475569,#64748b,#818cf8,#a78bfa"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
